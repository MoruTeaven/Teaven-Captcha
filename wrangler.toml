name = "teaven-captcha"
main = "src/index.ts"
compatibility_date = "2026-07-06"
compatibility_flags = ["nodejs_compat"]
account_id = "40c5cdd4a50968b4e395ec7a001b9f3f"
workers_dev = true

[vars]
APP_ENV = "production"
CORS_ORIGIN = ""
LOG_RETENTION_DAYS = "30"

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "teaven-captcha"
database_id = "6b92dbdd-096f-4e7a-b3e9-184851a489b2"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
